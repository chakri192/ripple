<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f2707c"/></marker>
  </defs>
  <style>
    .h { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .n { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    .d { font-size: 9.5px; fill: #8a9bb4; }
    .m { font-size: 9px; fill: #5d6675; font-family: SFMono-Regular,Menlo,monospace; }
  </style>

  <rect width="880" height="450" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="449" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">THE MODEL WRITES THE SENTENCES, NOT THE FACTS</text>

  <!-- input -->
  <rect x="28" y="62" width="150" height="54" rx="8" fill="#12151b" stroke="#f2707c" stroke-width="1.3"/>
  <text x="103" y="84" class="n" text-anchor="middle">one broken URN</text>
  <text x="103" y="102" class="m" text-anchor="middle" font-size="8.5">prod.raw.orders_raw</text>

  <line x1="178" y1="89" x2="212" y2="89" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- READ -->
  <rect x="216" y="62" width="196" height="176" rx="9" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <rect x="230" y="54" width="52" height="16" fill="#0b0d11"/>
  <text x="238" y="66" class="h" fill="#5fd0de">READ</text>
  <text x="232" y="90" class="d">Walk downstream lineage across</text>
  <text x="232" y="104" class="d">every hop and every platform.</text>
  <line x1="232" y1="116" x2="396" y2="116" stroke="#2b313d"/>
  <text x="232" y="136" class="d">· every affected table, view,</text>
  <text x="242" y="150" class="d">and dashboard</text>
  <text x="232" y="170" class="d">· the exact columns, from</text>
  <text x="242" y="184" class="d">fine-grained lineage</text>
  <text x="232" y="204" class="d">· owners across the whole</text>
  <text x="242" y="218" class="d">blast radius</text>
  <text x="232" y="232" class="m">searchAcrossLineage</text>

  <line x1="412" y1="150" x2="446" y2="150" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- REASON -->
  <rect x="450" y="62" width="196" height="176" rx="9" fill="#12151b" stroke="#a78bfa" stroke-width="1.3"/>
  <rect x="464" y="54" width="72" height="16" fill="#0b0d11"/>
  <text x="472" y="66" class="h" fill="#a78bfa">REASON</text>
  <text x="466" y="90" class="d">Rank by criticality, assign a</text>
  <text x="466" y="104" class="d">severity, decide who gets paged.</text>
  <line x1="466" y1="116" x2="630" y2="116" stroke="#2b313d"/>
  <text x="466" y="136" class="d">SEV1 the moment a customer-</text>
  <text x="466" y="150" class="d">facing dashboard lands in the</text>
  <text x="466" y="164" class="d">blast zone.</text>
  <rect x="466" y="176" width="164" height="50" rx="6" fill="#0f1319" stroke="#39414f"/>
  <text x="476" y="194" class="m" fill="#7ddc8b">all of this is plain code</text>
  <text x="476" y="209" class="d" font-size="9">same input → same output,</text>
  <text x="476" y="221" class="d" font-size="9">every single run</text>

  <line x1="646" y1="150" x2="680" y2="150" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- WRITE -->
  <rect x="684" y="62" width="168" height="176" rx="9" fill="#12151b" stroke="#7ddc8b" stroke-width="1.3"/>
  <rect x="698" y="54" width="58" height="16" fill="#0b0d11"/>
  <text x="706" y="66" class="h" fill="#7ddc8b">WRITE</text>
  <text x="700" y="90" class="d">Back into the catalog —</text>
  <text x="700" y="104" class="d">this is the point.</text>
  <line x1="700" y1="116" x2="836" y2="116" stroke="#2b313d"/>
  <text x="700" y="136" class="d">· an <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">incident</tspan> tag</text>
  <text x="712" y="149" class="m" font-size="8">GlobalTags</text>
  <text x="700" y="170" class="d">· a triage runbook</text>
  <text x="712" y="183" class="m" font-size="8">EditableDatasetProperties</text>
  <text x="700" y="204" class="d">· a first-class Incident</text>
  <text x="712" y="217" class="m" font-size="8">IncidentInfo</text>
  <text x="700" y="232" class="m">→ DataHub GMS</text>

  <!-- the LLM boundary -->
  <line x1="28" y1="264" x2="852" y2="264" stroke="#2b313d"/>
  <text x="28" y="290" class="h" fill="#8a9bb4">WHERE THE MODEL IS ALLOWED IN</text>

  <rect x="28" y="302" width="404" height="120" rx="8" fill="#12151b" stroke="#f2707c" stroke-width="1.2"/>
  <text x="44" y="324" class="n" fill="#f2707c">never touches the analysis</text>
  <text x="44" y="346" class="d">Which assets are affected, how severe it is, and who</text>
  <text x="44" y="360" class="d">to page are all decided by traversal and ranking code.</text>
  <text x="44" y="382" class="d">That is what makes the output safe to act on at 3am —</text>
  <text x="44" y="396" class="d">and what makes the same incident produce the same</text>
  <text x="44" y="410" class="d">answer twice.</text>

  <rect x="448" y="302" width="404" height="120" rx="8" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="464" y="324" class="n" fill="#a78bfa">writes the narrative, and only that</text>
  <text x="464" y="346" class="d">The LLM turns a settled set of facts into the prose a</text>
  <text x="464" y="360" class="d">human reads in the runbook.</text>
  <text x="464" y="382" class="d">If it were offline you would lose the readable summary</text>
  <text x="464" y="396" class="d">and keep the entire blast radius, the severity, and the</text>
  <text x="464" y="410" class="d">owner list intact.</text>
</svg>
